version: 2

models:
  - name: int_statement
    description: >
      Deprecated model retained temporarily for backward compatibility. The
      current IBKR ACCT extract contains account configuration metadata but no
      statement-generation timestamp, so this model should not be used by new
      downstream transformations.
    config:
      meta:
        deprecated: true
    columns:
      - name: document_generation_timestamp
        description: >
          Legacy statement-generation timestamp. This field is not available
          in the current ACCT source format.
