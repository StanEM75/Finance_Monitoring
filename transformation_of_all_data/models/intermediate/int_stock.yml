version: 2

models:
  - name: int_stock
    description: >
      Retains the ticker, unadjusted OHLC prices, and record date required for
      price analysis. Adjusted prices, volume, dividends, split history, and
      descriptive instrument metadata are intentionally excluded.
    columns:
      - name: asset_symbol
        description: Ticker symbol identifying the financial instrument.
        data_tests:
          - not_null
      - name: asset_open_price
        description: Opening price of the trading session.
      - name: asset_close_price
        description: Closing price of the trading session.
      - name: asset_low_price
        description: Lowest price during the trading session.
      - name: asset_high_price
        description: Highest price during the trading session.
      - name: record_date
        description: Trading date derived from the source market-data timestamp.
