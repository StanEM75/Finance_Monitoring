version: 2

sources:
  - name: raw
    description: Raw portfolio and market data loaded into DuckDB.
    schema: main
    tables:
      - name: raw_stock_data
        description: Daily market prices retrieved from Marketstack.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "EXTRACT(year FROM date) IN (2025, 2026)"
              config:
                store_failures: true
                schema: DBT_TESTS
                alias: raw_stock_data_date_year_2025_or_2026
                severity: error
        columns:
          - name: symbol
            data_type: varchar
            description: Ticker symbol identifying the financial instrument.
            data_tests:
              - not_null:
                  config:
                    store_failures: true
                    schema: DBT_TESTS
                    alias: raw_stock_data_symbol_not_null
                    severity: error
          - name: date
            data_type: timestamp with time zone
            description: Market data timestamp.
            data_tests:
              - not_null:
                  config:
                    store_failures: true
                    schema: DBT_TESTS
                    alias: raw_stock_data_date_not_null
                    severity: error
          - name: open
            data_type: double
            description: Opening price.
          - name: high
            data_type: double
            description: Highest price during the trading session.
          - name: low
            data_type: double
            description: Lowest price during the trading session.
          - name: close
            data_type: double
            description: Closing price.
          - name: volume
            data_type: double
            description: Number of units traded during the session.
          - name: adj_open
            data_type: double
            description: Opening price adjusted for corporate actions.
          - name: adj_high
            data_type: double
            description: Highest price adjusted for corporate actions.
          - name: adj_low
            data_type: double
            description: Lowest price adjusted for corporate actions.
          - name: adj_close
            data_type: double
            description: Closing price adjusted for corporate actions.
          - name: adj_volume
            data_type: bigint
            description: Trading volume adjusted for corporate actions.
          - name: split_factor
            data_type: double
            description: Stock split factor applied during the session.
          - name: dividend
            data_type: double
            description: Dividend amount associated with the session.
          - name: name
            data_type: varchar
            description: Company or financial instrument name.
          - name: exchange
            data_type: varchar
            description: Name of the stock exchange.
          - name: exchange_code
            data_type: varchar
            description: Code identifying the stock exchange.
          - name: asset_type
            data_type: varchar
            description: Type of financial instrument.
          - name: price_currency
            data_type: varchar
            description: Currency in which prices are quoted.
            data_tests:
              - accepted_values:
                  arguments:
                    values: [USD, EUR, KRW]
                  config:
                    store_failures: true
                    schema: DBT_TESTS
                    alias: raw_stock_data_price_currency_accepted_values
                    severity: warn

      - name: raw_statement_data
        description: IBKR account metadata extracted from the ACCT section.
        columns:
          - name: ClientAccountID
            data_type: varchar
            description: Interactive Brokers client account identifier.
            data_tests:
              - not_null
          - name: AccountAlias
            data_type: varchar
            description: Optional user-defined account alias.
          - name: CurrencyPrimary
            data_type: varchar
            description: Primary currency configured for the account.
          - name: AccountType
            data_type: varchar
            description: Interactive Brokers account type.
          - name: IBEntity
            data_type: varchar
            description: Interactive Brokers legal entity servicing the account.
          - name: TaxLotMatchingMethod
            data_type: varchar
            description: Tax-lot matching method configured for the account.

      - name: raw_open_positions_data
        description: Current portfolio positions extracted from the IBKR POST section.
        columns:
          - name: ClientAccountID
            data_type: varchar
            description: Interactive Brokers client account identifier.
          - name: CurrencyPrimary
            data_type: varchar
            description: Currency in which the position is valued.
          - name: AssetClass
            data_type: varchar
            description: IBKR asset class code.
          - name: Symbol
            data_type: varchar
            description: Ticker symbol identifying the financial instrument.
            data_tests:
              - not_null:
                  config:
                    store_failures: true
                    schema: DBT_TESTS
                    alias: raw_open_positions_data_symbol_not_null
                    severity: error
          - name: Description
            data_type: varchar
            description: Full name of the financial instrument.
          - name: Conid
            data_type: bigint
            description: IBKR contract identifier.
          - name: ListingExchange
            data_type: varchar
            description: Exchange on which the instrument is listed.
          - name: Multiplier
            data_type: bigint
            description: Contract multiplier applied to the position.
          - name: ReportDate
            data_type: bigint
            description: Date associated with the position snapshot.
          - name: Quantity
            data_type: bigint
            description: Number of units held.
          - name: MarkPrice
            data_type: double
            description: Current marked price per unit.
          - name: PositionValue
            data_type: double
            description: Current market value of the complete position.
          - name: CostBasisPrice
            data_type: double
            description: Average acquisition cost per unit.
          - name: CostBasisMoney
            data_type: double
            description: Total acquisition cost of the position.
          - name: FifoPnlUnrealized
            data_type: double
            description: Unrealized profit or loss calculated with FIFO accounting.
          - name: Side
            data_type: varchar
            description: Position direction, such as Long or Short.

      - name: raw_performance_data
        description: Realized and unrealized performance extracted from the IBKR FIFO section.
        columns:
          - name: ClientAccountID
            data_type: varchar
            description: Interactive Brokers client account identifier.
          - name: AssetClass
            data_type: varchar
            description: IBKR asset class code.
          - name: Symbol
            data_type: varchar
            description: Ticker symbol identifying the financial instrument.
            data_tests:
              - not_null:
                  config:
                    store_failures: true
                    schema: DBT_TESTS
                    alias: raw_performance_data_symbol_not_null
                    severity: warn
          - name: Description
            data_type: varchar
            description: Full name of the financial instrument.
          - name: Conid
            data_type: bigint
            description: IBKR contract identifier.
          - name: ISIN
            data_type: varchar
            description: International Securities Identification Number.
          - name: ListingExchange
            data_type: varchar
            description: Exchange on which the instrument is listed.
          - name: Multiplier
            data_type: bigint
            description: Contract multiplier.
          - name: ReportDate
            data_type: bigint
            description: Date associated with the performance snapshot.
          - name: CostAdjustment
            data_type: bigint
            description: Cost-basis adjustment applied by IBKR.
          - name: TotalRealizedPnl
            data_type: double
            description: Total realized profit or loss.
          - name: TotalUnrealizedPnl
            data_type: double
            description: Total unrealized profit or loss.
          - name: TotalFifoPnl
            data_type: double
            description: Combined realized and unrealized FIFO profit or loss.
          - name: TransferredPnl
            data_type: bigint
            description: Profit or loss transferred into the account.
