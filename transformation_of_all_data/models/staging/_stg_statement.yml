version: 2

models:
  - name: stg_statement
    description: Standardizes metadata extracted from the Interactive Brokers account statement.

    columns:
      - name: broker_name
        description: Name of the broker.

      - name: broker_address
        description: Broker's address.

      - name: document_title
        description: Title of the account statement.

      - name: period_covered
        description: Reporting period covered by the statement.

      - name: document_generation_timestamp
        description: Timestamp when the statement was generated.