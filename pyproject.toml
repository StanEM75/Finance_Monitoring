[project]
name = "financial-api"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "currex>=0.2.0",
    "dbt-core>=1.11.11",
    "dbt-duckdb>=1.10.1",
    "dotenv>=0.9.9",
    "duckdb>=1.4.1",
    "forex-python>=1.9.2",
    "great-tables>=0.20.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pendulum>=3.1.0",
    "polars>=1.35.1",
    "pre-commit>=4.3.0",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
]

[tool.ruff]
# Target Python 3.12 (aligned with requires-python).
target-version = "py312"
line-length = 88
# Ruff already respects .gitignore; also exclude generated artifacts.
extend-exclude = [
    "airflow_orchestration/.astro",
    "transformation_of_all_data/dbt_packages",
    "transformation_of_all_data/target",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort (import sorting),
# UP: pyupgrade, B: bugbear, SIM: simplifications.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Black-style formatting (Ruff default, made explicit here).
quote-style = "double"
indent-style = "space"
