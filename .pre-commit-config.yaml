repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types:
          - yaml

      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types:
          - python

      - id: sqlfluff
        name: sqlfluff
        entry: env DBT_OUTPUT_DIR=/tmp/dbt_outputs sqlfluff lint
        language: system
        types:
          - sql
